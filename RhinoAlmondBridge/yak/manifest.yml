name: almondbridge
version: 0.6.0
authors:
  - LiangJung
description: >
  Almond for Rhino 8: an offline architectural Object Archive and an MCP
  bridge for AI-assisted modelling. Run Almond for the Neo Swiss Models and
  Structural Validation menu. AlmondLibrary opens Models; AlmondStructure opens
  analysis controls, support/load diagrams, a live viewport overlay and result
  records. The built-in native engine needs uv (as the MCP server does);
  Karamba is optional and needs its own installation/licence. Checks are
  design-stage screening, not code verification.
  AlmondLibraryBrowser opens the full
  browser view. Compact thumbnails offer native placement as shared blocks,
  with optional lighter meshes. Browsing and placement require no Python or AI client.

  Includes 50 generated GLB models with embedded metadata and source records,
  10 linked drawing packages (60 SVG/DXF view-scale pairs and 20 A3 SVG sheets),
  and an offline interactive 3D viewer. Models and derived drawings are
  attributed to Almond generated asset library under CC BY 4.0; code is MIT.
  Generated geometry and silhouette drawings are design aids, not verified
  manufacturer products or construction details.

  Seven optional drawing elements are indexed as metadata and source links.
  Third-party community model files are not bundled. Download them separately
  from their original sources under the applicable terms.

  The MCP bridge listens on 127.0.0.1:5000. For AI workflows, install uv and
  register uvx --from almond-mcp==0.6.0 almond-mcp with your MCP client.
  Windows only; supports Rhino 8.0 and later Rhino 8 service releases.
url: https://github.com/liangjunglj-cpu/almond-mcp
icon: icon.png
keywords:
  - almond
  - mcp
  - architecture
