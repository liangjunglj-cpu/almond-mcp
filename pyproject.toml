[project]
name = "almond-mcp"
version = "0.6.0rc5"
description = "Almond - MCP server for Rhino 8 with a semantic scene layer: curated furniture/drawing/diagram libraries, audited Karamba capsules, structured retrieval (SQLite FTS5 + R-tree scene ledger), and a TCP bridge into Rhino (RhinoAlmondBridge, port 5000)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "LiangJung" }]
keywords = ["mcp", "rhino", "grasshopper", "karamba", "architecture", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "fastmcp>=3.0.2",
    "lxml>=6.0.2",
    "mcp>=1.26.0",
    "pydantic>=2.12.5",
    "numpy>=2.0,<3",
    "shapely>=2.1,<3",
    "ezdxf>=1.4,<2",
    "pillow>=11,<13",
    "contourpy>=1.3,<2",
]

[project.scripts]
almond-mcp = "almond_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["almond_mcp"]

# Manifests and audited JSON ship inside the wheel as almond_mcp/data/ so a
# fresh install can scaffold the user data directory. Only the original,
# generated CC BY 4.0 model pack is included. Downloaded 3D Warehouse models
# are NEVER included; see THIRD-PARTY-NOTICES.md and docs/licensing-audit.md.
[tool.hatch.build.targets.wheel.force-include]
"IkeaFurniturefiles/manifest.json" = "almond_mcp/data/IkeaFurniturefiles/manifest.json"
"IkeaFurniturefiles/SPATIAL_GENERATION_PLAN.md" = "almond_mcp/data/IkeaFurniturefiles/SPATIAL_GENERATION_PLAN.md"
"DrawingAssetfiles/manifest.json" = "almond_mcp/data/DrawingAssetfiles/manifest.json"
"DiagramAssetfiles/manifest.json" = "almond_mcp/data/DiagramAssetfiles/manifest.json"
"GeneratedAssetfiles/manifest.json" = "almond_mcp/data/GeneratedAssetfiles/manifest.json"
"GeneratedAssetfiles/models" = "almond_mcp/data/GeneratedAssetfiles/models"
"GeneratedAssetfiles/previews" = "almond_mcp/data/GeneratedAssetfiles/previews"
"GeneratedAssetfiles/passport.schema.json" = "almond_mcp/data/GeneratedAssetfiles/passport.schema.json"
"GeneratedAssetfiles/README.md" = "almond_mcp/data/GeneratedAssetfiles/README.md"
"GeneratedAssetfiles/catalogue.json" = "almond_mcp/data/GeneratedAssetfiles/catalogue.json"
"GeneratedAssetfiles/provenance.json" = "almond_mcp/data/GeneratedAssetfiles/provenance.json"
"GeneratedAssetfiles/source-register.json" = "almond_mcp/data/GeneratedAssetfiles/source-register.json"
"DrawingRecipes" = "almond_mcp/data/DrawingRecipes"
"Draftingfiles" = "almond_mcp/data/Draftingfiles"
"capsules" = "almond_mcp/data/capsules"
"Materialfiles/manifest.json" = "almond_mcp/data/Materialfiles/manifest.json"
"Constructionfiles/manifest.json" = "almond_mcp/data/Constructionfiles/manifest.json"
"Historyfiles/manifest.json" = "almond_mcp/data/Historyfiles/manifest.json"

[tool.hatch.build.targets.sdist]
include = [
    "/almond_mcp", "/tests", "/docs", "/capsules", "/DrawingRecipes",
    "/Draftingfiles", "/tools/build_drawing_pilot.py",
    "/GeneratedAssetfiles/manifest.json", "/GeneratedAssetfiles/catalogue.json",
    "/GeneratedAssetfiles/provenance.json", "/GeneratedAssetfiles/passport.schema.json",
    "/GeneratedAssetfiles/source-register.json",
    "/GeneratedAssetfiles/README.md", "/GeneratedAssetfiles/models", "/GeneratedAssetfiles/previews",
    "/IkeaFurniturefiles/manifest.json", "/IkeaFurniturefiles/SPATIAL_GENERATION_PLAN.md",
    "/DrawingAssetfiles/manifest.json", "/DiagramAssetfiles/manifest.json",
    "/Materialfiles/manifest.json", "/Constructionfiles/manifest.json", "/Historyfiles/manifest.json",
    "/tools/build_generated_assets.py", "/tools/enrich_generated_assets.py",
    "/tools/document_generation_sources.py",
    "/tools/build_archive_bundle.py", "/tools/verify_object_archive_install.py",
    "/tools/render_generated_previews.py", "/tools/verify_release.py",
    "/README.md", "/AGENTS.md", "/LICENSE", "/THIRD-PARTY-NOTICES.md",
    "/pyproject.toml", "/uv.lock", "/.gitattributes",
]
# Belt and braces on top of .gitignore: downloaded model files and compiled
# bridge binaries must never reach a distribution artifact.
exclude = [
    "IkeaFurniturefiles/models",
    "DrawingAssetfiles/models",
    "DiagramAssetfiles/models",
    "Grasshopperfiles",
    "dist",
    "RhinoAlmondBridge",
    "*.sqlite3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
